name: SAM plugins

on:
  pull_request:
    paths:
      - 'apps-sam/**'
      - '.github/workflows/sam-plugins.yml'
  push:
    branches: [main]
    paths:
      - 'apps-sam/**'
      - '.github/workflows/sam-plugins.yml'

jobs:
  backend:
    name: Backend (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [shared, bank-reconcile, gocardless, suppliers, balance-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps-sam/package-lock.json

      - name: Install workspace
        working-directory: apps-sam
        run: npm ci

      - name: Lint
        working-directory: apps-sam/${{ matrix.plugin }}
        run: npm run lint

      - name: Test
        working-directory: apps-sam/${{ matrix.plugin }}
        run: npm test

  frontend:
    name: Frontend (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [bank-reconcile, gocardless, suppliers, balance-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install plugin frontend deps
        working-directory: apps-sam/${{ matrix.plugin }}/frontend
        run: npm install --no-audit --no-fund

      - name: Type-check
        working-directory: apps-sam/${{ matrix.plugin }}/frontend
        run: npm run type-check

      - name: Build
        working-directory: apps-sam/${{ matrix.plugin }}/frontend
        run: npm run build

      - name: Verify bundle artefacts
        working-directory: apps-sam/${{ matrix.plugin }}/frontend
        run: |
          test -f dist/index.js
          test -f dist/style.css
          ls -lh dist/

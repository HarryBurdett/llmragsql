# SQL RAG — API gateway routing
# ================================
#
# Routes incoming requests to the correct backend container based on
# the URL path. Mirrors what SAM's ingress / API gateway will do.
#
# The frontend talks to ONE URL (http://localhost:8080) and never
# needs to know which backend serves which path. That decoupling is
# what makes the SAM migration cheap — only this config changes,
# not the frontend.
#
# Path → backend mapping
# ----------------------
#   /api/bank-import/*        → bank-reconcile (also bank-rec UI)
#   /api/reconcile/bank/*     → bank-reconcile
#   /api/opera3/bank-import/* → bank-reconcile (Opera 3 mirror)
#   /api/gocardless/*         → gocardless
#   /api/suppliers/*          → suppliers
#   /api/supplier-*           → suppliers
#   /api/reconcile/creditors  → balance-check
#   /api/reconcile/debtors    → balance-check
#   /api/reconcile/vat        → balance-check
#   /api/email*               → core-email
#   /api/system/*             → core-email (auth, company switch)
#   /api/*                    → bank-reconcile (default for now)
#   /                         → frontend (Vite dev server)

upstream bank_reconcile {
    server bank-reconcile:8000;
}

upstream gocardless {
    server gocardless:8000;
}

upstream suppliers {
    server suppliers:8000;
}

upstream balance_check {
    server balance-check:8000;
}

upstream core_email {
    server core-email:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;        # Bank statement PDFs can be large

    # ----- bank-reconcile routes -----
    location ~ ^/api/(bank-import|reconcile/bank/|opera3/bank-import|opera3/reconcile/bank/|repeat-entries) {
        proxy_pass http://bank_reconcile;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ----- gocardless routes -----
    location ~ ^/api/(gocardless|opera3/gocardless) {
        proxy_pass http://gocardless;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # ----- suppliers routes -----
    location ~ ^/api/(suppliers|supplier-) {
        proxy_pass http://suppliers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # ----- balance-check routes -----
    location ~ ^/api/reconcile/(creditors|debtors|vat|cashbook) {
        proxy_pass http://balance_check;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ----- core-email routes (system + email + auth) -----
    location ~ ^/api/(email|system|auth|companies|installations) {
        proxy_pass http://core_email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # ----- default API routes — bank-reconcile catches the rest -----
    # Phase B: split these into per-app routes once boundaries are
    # finalised. For now bank-reconcile is the catch-all.
    location /api/ {
        proxy_pass http://bank_reconcile;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # ----- healthz aggregator -----
    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

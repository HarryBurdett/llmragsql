# SQL RAG — Local Development Compose Stack
# =============================================
#
# Spins up each application as its own container, networked
# together. This is the pre-SAM development stack — same shape
# the apps will have when they migrate into SAM, just with
# docker-compose providing env vars instead of SAM.
#
# Usage:
#   cp .env.example .env
#   # edit .env with your Opera SQL credentials, IMAP creds, etc.
#   docker compose up
#
# Frontend is at http://localhost:5173
# API gateway is at http://localhost:8080
# Each app exposes its port directly for debugging:
#   bank-reconcile  : 8001
#   gocardless      : 8002
#   suppliers       : 8003
#   balance-check   : 8004
#   core-email      : 8005
#
# Phase A note: this compose file uses the `monolith` target by
# default for all apps to preserve current behaviour. Each "service"
# below is the same container image with a different APP_NAME +
# INSTALLED_APPS. When Phase B (per-app independence) lands, each
# service switches to its dedicated target.

version: "3.9"

services:
  # =================================================================
  # bank-reconcile — bank statement scan, reconcile, Opera posting
  # =================================================================
  bank-reconcile:
    build:
      context: .
      target: monolith   # Phase B: change to bank-reconcile
    image: sqlrag/bank-reconcile:dev
    container_name: sqlrag-bank-reconcile
    env_file: .env
    environment:
      APP_NAME: bank-reconcile
      INSTALLED_APPS: bank_reconcile
      COMPANY_DATA_BASE_PATH: /app/data
      # Inter-service URLs — populated by docker-compose's network
      CORE_EMAIL_URL: http://core-email:8000
      CORE_OPERA_SE_URL: http://core-opera-se:8000
      OPERA3_WRITE_AGENT_URL: ${OPERA3_WRITE_AGENT_URL:-}
    volumes:
      - bank-reconcile-data:/app/data
      - bank-reconcile-archive:/app/archive
    ports:
      - "8001:8000"
    networks:
      - sqlrag-net
    restart: unless-stopped
    depends_on:
      core-email:
        condition: service_healthy

  # =================================================================
  # gocardless — Direct Debit payout import
  # =================================================================
  gocardless:
    build:
      context: .
      target: monolith   # Phase B: change to gocardless
    image: sqlrag/gocardless:dev
    container_name: sqlrag-gocardless
    env_file: .env
    environment:
      APP_NAME: gocardless
      INSTALLED_APPS: gocardless
      COMPANY_DATA_BASE_PATH: /app/data
      CORE_EMAIL_URL: http://core-email:8000
      CORE_OPERA_SE_URL: http://core-opera-se:8000
      BANK_RECONCILE_URL: http://bank-reconcile:8000
    volumes:
      - gocardless-data:/app/data
    ports:
      - "8002:8000"
    networks:
      - sqlrag-net
    restart: unless-stopped
    depends_on:
      core-email:
        condition: service_healthy

  # =================================================================
  # suppliers — supplier statement reconciliation
  # =================================================================
  suppliers:
    build:
      context: .
      target: monolith   # Phase B: change to suppliers
    image: sqlrag/suppliers:dev
    container_name: sqlrag-suppliers
    env_file: .env
    environment:
      APP_NAME: suppliers
      INSTALLED_APPS: suppliers
      COMPANY_DATA_BASE_PATH: /app/data
      CORE_EMAIL_URL: http://core-email:8000
      CORE_OPERA_SE_URL: http://core-opera-se:8000
    volumes:
      - suppliers-data:/app/data
    ports:
      - "8003:8000"
    networks:
      - sqlrag-net
    restart: unless-stopped
    depends_on:
      core-email:
        condition: service_healthy

  # =================================================================
  # balance-check — internal Opera balance reconciliation (read-only)
  # =================================================================
  balance-check:
    build:
      context: .
      target: monolith   # Phase B: change to balance-check
    image: sqlrag/balance-check:dev
    container_name: sqlrag-balance-check
    env_file: .env
    environment:
      APP_NAME: balance-check
      INSTALLED_APPS: balance_check
      COMPANY_DATA_BASE_PATH: /app/data
    volumes:
      - balance-check-data:/app/data
    ports:
      - "8004:8000"
    networks:
      - sqlrag-net
    restart: unless-stopped

  # =================================================================
  # core-email — shared IMAP poller + email storage
  # =================================================================
  # Phase B will make this a real standalone service. Today it's
  # the same container as the apps, just with INSTALLED_APPS
  # restricted. Apps consume from it via HTTP at CORE_EMAIL_URL.
  core-email:
    build:
      context: .
      target: monolith   # Phase B: change to core-email
    image: sqlrag/core-email:dev
    container_name: sqlrag-core-email
    env_file: .env
    environment:
      APP_NAME: core-email
      INSTALLED_APPS: core_email
      COMPANY_DATA_BASE_PATH: /app/data
    volumes:
      - core-email-data:/app/data
    ports:
      - "8005:8000"
    networks:
      - sqlrag-net
    restart: unless-stopped

  # =================================================================
  # nginx-gateway — reverse proxy in front of the apps
  # =================================================================
  # Frontend talks to one URL (http://localhost:8080). Gateway
  # routes /api/{app}/* to the right backend. Mirrors what SAM's
  # ingress will do.
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: sqlrag-gateway
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - sqlrag-net
    depends_on:
      - bank-reconcile
      - gocardless
      - suppliers
      - balance-check
      - core-email
    restart: unless-stopped

  # =================================================================
  # frontend — React UI (Vite dev server)
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sqlrag/frontend:dev
    container_name: sqlrag-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    networks:
      - sqlrag-net
    restart: unless-stopped
    depends_on:
      - nginx-gateway

# =====================================================================
# Networks + named volumes
# =====================================================================
# One private network so containers reach each other by service name.
# Per-app named volumes so each app's SQLite state survives container
# rebuilds. SAM will replace these with whatever it provides for
# persistent storage.

networks:
  sqlrag-net:
    driver: bridge

volumes:
  bank-reconcile-data:
  bank-reconcile-archive:
  gocardless-data:
  suppliers-data:
  balance-check-data:
  core-email-data:
